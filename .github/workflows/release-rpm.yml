name: Release native RPM

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      checkout_ref:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: Native version tag, for example native-v0.2.0
        required: true
        type: string
      checkout_ref:
        description: Optional source reference for artifact-only verification
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: release-rpm-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  context:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'native-v')
    uses: ./.github/workflows/native-release-context.yml
    with:
      tag: ${{ inputs.tag || '' }}
      checkout_ref: ${{ inputs.checkout_ref || '' }}
      publish: false
  packages:
    needs: context
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: 'fedora:latest'
            target: fedora
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: 'fedora:latest'
            target: fedora
    uses: ./.github/workflows/native-linux-package.yml
    with:
      kind: rpm
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      image: ${{ matrix.image }}
      target: ${{ matrix.target }}
      version: ${{ needs.context.outputs.version }}
      source_sha: ${{ needs.context.outputs.source_sha }}
