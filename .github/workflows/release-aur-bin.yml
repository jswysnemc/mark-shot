name: Release native AUR binary packages

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      checkout_ref:
        type: string
        default: ''
      upload_to_release:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Native version tag, for example native-v0.2.0
        required: true
        type: string
      checkout_ref:
        description: Optional source reference for artifact-only verification
        type: string
        default: ''
      upload_to_release:
        description: Publish manual-run assets only after verifying the exact native tag
        type: boolean
        default: false
      push_to_aur:
        description: Publish binary metadata to AUR after GitHub assets are verified
        type: boolean
        default: false
      pkgrel:
        description: AUR metadata release number
        type: string
        default: '1'
permissions:
  contents: read
concurrency:
  group: release-aur-bin-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  context:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'native-v')
    uses: ./.github/workflows/native-release-context.yml
    with:
      tag: ${{ inputs.tag || '' }}
      checkout_ref: ${{ inputs.checkout_ref || '' }}
      publish: ${{ inputs.upload_to_release || inputs.push_to_aur || false }}
  packages:
    needs: context
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: 'archlinux:base-devel'
            target: arch
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: ''
            target: ubuntu2404
    uses: ./.github/workflows/native-linux-package.yml
    with:
      kind: pacman
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      image: ${{ matrix.image }}
      target: ${{ matrix.target }}
      version: ${{ needs.context.outputs.version }}
      source_sha: ${{ needs.context.outputs.source_sha }}

  publish:
    needs: [context, packages]
    if: needs.context.outputs.publish == 'true' && inputs.upload_to_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: target/publish-assets
      - name: Publish only verified immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_TAG: ${{ needs.context.outputs.tag }}
          SOURCE_SHA: ${{ needs.context.outputs.source_sha }}
        run: python3 scripts/packaging/publish_assets.py --directory target/publish-assets --tag "$NATIVE_TAG" --source-sha "$SOURCE_SHA"

  aur:
    needs: [context, packages, publish]
    if: always() && needs.packages.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && !contains(needs.context.outputs.version, '-')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: native-pacman-*
          merge-multiple: true
          path: target/aur-assets
      - name: Prepare binary package from verified assets
        env:
          NATIVE_TAG: ${{ needs.context.outputs.tag }}
          SOURCE_SHA: ${{ needs.context.outputs.source_sha }}
          PKGREL: ${{ inputs.pkgrel || '1' }}
        run: python3 scripts/packaging/prepare_aur.py --pkgrel "$PKGREL" --binary --assets target/aur-assets --tag "$NATIVE_TAG" --source-sha "$SOURCE_SHA"

      - name: Generate canonical SRCINFO
        run: |
          docker run --rm -v "$PWD/target/aur-work:/pkg" -w /pkg archlinux:base-devel bash -lc 'pacman -Syu --noconfirm --needed sudo >/dev/null; useradd -m builder; chown -R builder:builder /pkg; su builder -c "cd /pkg && makepkg --printsrcinfo > .SRCINFO"'
      - uses: actions/upload-artifact@v4
        with:
          name: native-aur-bin-metadata
          path: target/aur-work/
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish validated AUR metadata
        if: needs.context.outputs.publish == 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_to_aur)
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ vars.AUR_SSH_KNOWN_HOSTS }}
        run: bash scripts/packaging/publish_aur.sh mark-shot-bin target/aur-work
