name: Release native DEB

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      checkout_ref:
        type: string
        default: ''
      upload_to_release:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Native version tag, for example native-v0.2.0
        required: true
        type: string
      checkout_ref:
        description: Optional source reference for artifact-only verification
        type: string
        default: ''
      upload_to_release:
        description: Publish manual-run assets only after verifying the exact native tag
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-deb-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  context:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'native-v')
    uses: ./.github/workflows/native-release-context.yml
    with:
      tag: ${{ inputs.tag || '' }}
      checkout_ref: ${{ inputs.checkout_ref || '' }}
      publish: ${{ inputs.upload_to_release || false }}
  packages:
    needs: context
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: 'debian:12'
            target: debian12
          - arch: x86_64
            runner: ubuntu-24.04
            image: 'debian:13'
            target: debian13
          - arch: x86_64
            runner: ubuntu-24.04
            image: 'ubuntu:24.04'
            target: ubuntu2404
          - arch: x86_64
            runner: ubuntu-24.04
            image: 'ubuntu:26.04'
            target: ubuntu2604
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: 'debian:12'
            target: debian12
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: 'debian:13'
            target: debian13
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: 'ubuntu:24.04'
            target: ubuntu2404
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: 'ubuntu:26.04'
            target: ubuntu2604
    uses: ./.github/workflows/native-linux-package.yml
    with:
      kind: deb
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      image: ${{ matrix.image }}
      target: ${{ matrix.target }}
      version: ${{ needs.context.outputs.version }}
      source_sha: ${{ needs.context.outputs.source_sha }}

  publish:
    needs: [context, packages]
    if: needs.context.outputs.publish == 'true' && inputs.upload_to_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: target/publish-assets
      - name: Publish only verified immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_TAG: ${{ needs.context.outputs.tag }}
          SOURCE_SHA: ${{ needs.context.outputs.source_sha }}
        run: python3 scripts/packaging/publish_assets.py --directory target/publish-assets --tag "$NATIVE_TAG" --source-sha "$SOURCE_SHA"
