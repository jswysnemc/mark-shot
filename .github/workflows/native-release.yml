name: Native Release

on:
  push:
    tags: ['native-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing native tag to publish or retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  context:
    uses: ./.github/workflows/native-release-context.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      publish: true

  verify:
    needs: context
    uses: ./.github/workflows/native-build.yml
    with:
      checkout_ref: ${{ needs.context.outputs.source_sha }}

  binaries:
    needs: context
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ needs.context.outputs.tag }}
      checkout_ref: ${{ needs.context.outputs.source_sha }}
    secrets: inherit

  deb:
    needs: context
    uses: ./.github/workflows/release-deb.yml
    with:
      tag: ${{ needs.context.outputs.tag }}
      checkout_ref: ${{ needs.context.outputs.source_sha }}

  rpm:
    needs: context
    uses: ./.github/workflows/release-rpm.yml
    with:
      tag: ${{ needs.context.outputs.tag }}
      checkout_ref: ${{ needs.context.outputs.source_sha }}

  arch:
    needs: context
    uses: ./.github/workflows/release-aur-bin.yml
    with:
      tag: ${{ needs.context.outputs.tag }}
      checkout_ref: ${{ needs.context.outputs.source_sha }}

  appimage:
    needs: context
    uses: ./.github/workflows/release-appimage.yml
    with:
      tag: ${{ needs.context.outputs.tag }}
      checkout_ref: ${{ needs.context.outputs.source_sha }}

  flatpak:
    needs: context
    uses: ./.github/workflows/release-flatpak.yml
    with:
      tag: ${{ needs.context.outputs.tag }}
      checkout_ref: ${{ needs.context.outputs.source_sha }}

  publish:
    name: Publish complete verified release
    needs: [context, verify, binaries, deb, rpm, arch, appimage, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test release publication contracts
        run: python3 -m unittest discover -s tests/packaging -p 'test_release_*.py'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: target/publish-assets
      - name: Publish packages and inline checksums
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_TAG: ${{ needs.context.outputs.tag }}
          SOURCE_SHA: ${{ needs.context.outputs.source_sha }}
        run: python3 scripts/packaging/publish_assets.py --directory target/publish-assets --tag "$NATIVE_TAG" --source-sha "$SOURCE_SHA"
