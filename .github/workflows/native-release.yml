name: Native Release

on:
  push:
    tags: ['v*', 'native-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or retry, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  context:
    uses: ./.github/workflows/native-release-context.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      publish: true

  verify:
    needs: context
    uses: ./.github/workflows/native-build.yml
    with:
      checkout_ref: ${{ needs.context.outputs.source_sha }}

  binaries:
    needs: context
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ needs.context.outputs.tag }}
      checkout_ref: ${{ needs.context.outputs.source_sha }}
    secrets: inherit

  deb:
    needs: context
    uses: ./.github/workflows/release-deb.yml
    with:
      tag: ${{ needs.context.outputs.tag }}
      checkout_ref: ${{ needs.context.outputs.source_sha }}

  rpm:
    needs: context
    uses: ./.github/workflows/release-rpm.yml
    with:
      tag: ${{ needs.context.outputs.tag }}
      checkout_ref: ${{ needs.context.outputs.source_sha }}

  arch:
    needs: context
    uses: ./.github/workflows/release-aur-bin.yml
    with:
      tag: ${{ needs.context.outputs.tag }}
      checkout_ref: ${{ needs.context.outputs.source_sha }}

  appimage:
    needs: context
    uses: ./.github/workflows/release-appimage.yml
    with:
      tag: ${{ needs.context.outputs.tag }}
      checkout_ref: ${{ needs.context.outputs.source_sha }}

  flatpak:
    needs: context
    uses: ./.github/workflows/release-flatpak.yml
    with:
      tag: ${{ needs.context.outputs.tag }}
      checkout_ref: ${{ needs.context.outputs.source_sha }}

  publish:
    name: Publish complete verified release
    needs: [context, verify, binaries, deb, rpm, arch, appimage, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test release publication contracts
        run: python3 -m unittest discover -s tests/packaging -p 'test_release_*.py'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: target/publish-assets
      - name: Publish packages and inline checksums
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_TAG: ${{ needs.context.outputs.tag }}
          SOURCE_SHA: ${{ needs.context.outputs.source_sha }}
        run: python3 scripts/packaging/publish_assets.py --directory target/publish-assets --tag "$NATIVE_TAG" --source-sha "$SOURCE_SHA"

  aur:
    name: Publish validated AUR packages
    needs: [context, publish]
    if: ${{ needs.context.outputs.publish == 'true' && !contains(needs.context.outputs.version, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare immutable source AUR package
        env:
          NATIVE_TAG: ${{ needs.context.outputs.tag }}
          SOURCE_SHA: ${{ needs.context.outputs.source_sha }}
        run: python3 scripts/packaging/prepare_aur.py --pkgrel 1 --tag "$NATIVE_TAG" --source-sha "$SOURCE_SHA"
      - name: Generate canonical source SRCINFO
        run: |
          docker run --rm -v "$PWD/target/aur-work:/pkg" -w /pkg archlinux:base-devel bash -lc 'pacman -Syu --noconfirm --needed sudo >/dev/null; useradd -m builder; chown -R builder:builder /pkg; su builder -c "cd /pkg && makepkg --printsrcinfo > .SRCINFO"'
      - uses: actions/download-artifact@v4
        with:
          name: native-aur-bin-metadata
          path: target/aur-bin-work
      - name: Publish validated AUR metadata
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ vars.AUR_SSH_KNOWN_HOSTS }}
        run: |
          bash scripts/packaging/publish_aur.sh mark-shot target/aur-work
          bash scripts/packaging/publish_aur.sh mark-shot-bin target/aur-bin-work
