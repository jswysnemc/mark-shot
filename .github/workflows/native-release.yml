name: Native Preview Release

on:
  workflow_dispatch:
  push:
    branches:
      - rewrite/native-wayland
    paths:
      - '.github/workflows/native-release.yml'
      - 'release/native-preview*'
      - 'scripts/native_release*.py'
      - 'scripts/test_native_release*.py'

permissions:
  contents: read

concurrency:
  group: native-preview-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish verified native preview
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout publication instructions
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # 【原生发布】【历史说明】完整历史用于恢复已取消跟踪且摘要固定的发布说明
          fetch-depth: 0

      - name: Test publication validation
        run: python3 -m unittest discover -s scripts -p 'test_native_release*.py'

      - name: Check whether a preview is requested
        id: manifest
        run: |
          if [ -f release/native-preview-6.json ]; then
            echo 'prefix=release/native-preview-6' >> "$GITHUB_OUTPUT"
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [ -f release/native-preview-5.json ]; then
            echo 'prefix=release/native-preview-5' >> "$GITHUB_OUTPUT"
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [ -f release/native-preview-4.json ]; then
            echo 'prefix=release/native-preview-4' >> "$GITHUB_OUTPUT"
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [ -f release/native-preview-3.json ]; then
            echo 'prefix=release/native-preview-3' >> "$GITHUB_OUTPUT"
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [ -f release/native-preview-2.json ]; then
            echo 'prefix=release/native-preview-2' >> "$GITHUB_OUTPUT"
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [ -f release/native-preview.json ]; then
            echo 'prefix=release/native-preview' >> "$GITHUB_OUTPUT"
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish immutable verified artifact
        if: steps.manifest.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PREFIX: ${{ steps.manifest.outputs.prefix }}
        run: |
          python3 scripts/native_release.py \
            --manifest "$PREVIEW_PREFIX.json" \
            --notes "$PREVIEW_PREFIX-notes.md" \
            --verification "$PREVIEW_PREFIX-verification.json"
