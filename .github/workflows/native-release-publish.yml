name: Publish verified native artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing native tag to publish
        required: true
        type: string
      run_id:
        description: Native Release run with all builds and verification successful
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      version: ${{ steps.context.outputs.version }}
      source_sha: ${{ steps.context.outputs.source_sha }}
      run_id: ${{ steps.context.outputs.run_id }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test publication and build reuse contracts
        run: python3 -m unittest discover -s tests/packaging -p 'test_release_*.py'
      - name: Verify the complete canonical source build
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_TAG: ${{ inputs.tag }}
          VERIFIED_RUN_ID: ${{ inputs.run_id }}
        run: python3 scripts/packaging/release_build.py --tag "$NATIVE_TAG" --run-id "$VERIFIED_RUN_ID"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.context.outputs.run_id }}
          pattern: native-*
          merge-multiple: true
          path: target/publish-assets
      - name: Resume immutable verified publication
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_TAG: ${{ steps.context.outputs.tag }}
          SOURCE_SHA: ${{ steps.context.outputs.source_sha }}
        run: python3 scripts/packaging/publish_assets.py --directory target/publish-assets --tag "$NATIVE_TAG" --source-sha "$SOURCE_SHA"

  aur:
    name: Publish validated AUR packages
    needs: publish
    if: ${{ !contains(needs.publish.outputs.version, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare immutable source AUR package
        env:
          NATIVE_TAG: ${{ needs.publish.outputs.tag }}
          SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
        run: python3 scripts/packaging/prepare_aur.py --pkgrel 1 --tag "$NATIVE_TAG" --source-sha "$SOURCE_SHA"
      - name: Generate canonical source SRCINFO
        run: |
          docker run --rm -v "$PWD/target/aur-work:/pkg" -w /pkg archlinux:base-devel bash -lc 'pacman -Syu --noconfirm --needed sudo >/dev/null; useradd -m builder; chown -R builder:builder /pkg; su builder -c "cd /pkg && makepkg --printsrcinfo > .SRCINFO"'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.publish.outputs.run_id }}
          name: native-aur-bin-metadata
          path: target/aur-bin-work
      - name: Publish validated AUR metadata
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ vars.AUR_SSH_KNOWN_HOSTS }}
        run: |
          bash scripts/packaging/publish_aur.sh mark-shot target/aur-work
          bash scripts/packaging/publish_aur.sh mark-shot-bin target/aur-bin-work
