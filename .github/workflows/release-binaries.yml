name: Release native binaries

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      checkout_ref:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: Native version tag, for example native-v0.2.0
        required: true
        type: string
      checkout_ref:
        description: Optional source reference for artifact-only verification
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: release-binaries-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  context:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'native-v')
    uses: ./.github/workflows/native-release-context.yml
    with:
      tag: ${{ inputs.tag || '' }}
      checkout_ref: ${{ inputs.checkout_ref || '' }}
      publish: false

  packages:
    needs: context
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    uses: ./.github/workflows/native-linux-package.yml
    with:
      kind: portable
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      image: debian:12
      target: debian12
      version: ${{ needs.context.outputs.version }}
      source_sha: ${{ needs.context.outputs.source_sha }}
  windows:
    needs: context
    uses: ./.github/workflows/windows-build.yml
    with:
      checkout_ref: ${{ needs.context.outputs.source_sha }}
      sign: true
    secrets: inherit
  collect-windows:
    needs: [context, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mark-shot-native-windows-x86_64-msvc
          path: target/windows-download
      - name: Version the verified Windows asset
        env:
          PACKAGE_VERSION: ${{ needs.context.outputs.version }}
          SOURCE_SHA: ${{ needs.context.outputs.source_sha }}
        run: |
          (cd target/windows-download; sha256sum --check ./*.sha256)
          mkdir -p target/packages
          asset="target/packages/mark-shot-native-$PACKAGE_VERSION-windows-x86_64-msvc.zip"
          cp target/windows-download/*.zip "$asset"
          python3 scripts/packaging/artifact_metadata.py "$asset" --version "$PACKAGE_VERSION" --arch x86_64 --source-sha "$SOURCE_SHA" --format windows
      - uses: actions/upload-artifact@v4
        with:
          name: native-portable-windows-x86_64
          path: target/packages/
          if-no-files-found: error
