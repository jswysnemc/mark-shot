name: Windows Rust Build

on:
  push:
    branches:
      - rewrite/native-wayland
      - feat/native-recording
      - feat/native-barcode-scanning
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VSLANG: '1033'

jobs:
  media:
    name: Windows in-process media library
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nasm make pkg-config
      - name: Build minimal media library with sources
        run: bash scripts/media/build-libraries.sh windows > /tmp/recording-build.log 2>&1 || { tail -100 /tmp/recording-build.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-media
          path: target/media-windows/
          if-no-files-found: error
      - name: Build independent validation tools
        run: bash scripts/media/build-validation-tools.sh > /tmp/media-validation-build.log 2>&1 || { tail -100 /tmp/media-validation-build.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-media-validation
          path: target/media-validation-windows/
          if-no-files-found: error
  windows:
    name: Windows x86_64 MSVC (CPU OCR)
    runs-on: windows-2022
    needs: media
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC x64 tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc-cpu
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      # ocr-gpu contains Linux-only Dawn assembly; never use --all-features here.
      - name: Check all Rust targets with default features
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc --locked -j 2 -- -D warnings

      - name: Run Windows unit tests
        run: ./scripts/windows-test.ps1

      - name: Download media library
        uses: actions/download-artifact@v4
        with:
          name: windows-media
          path: target/media-windows

      - name: Download independent validation tools
        uses: actions/download-artifact@v4
        with:
          name: windows-media-validation
          path: target/media-validation-windows

      - name: Encode and decode native recording fixture
        run: |
          $env:MARK_SHOT_MEDIA_LIBRARY = Join-Path $env:GITHUB_WORKSPACE 'target/media-windows/markshot-media.dll'
          $env:MARK_SHOT_RECORDING_EVIDENCE = Join-Path $env:GITHUB_WORKSPACE 'target/windows-evidence/recording'
          cargo test --lib --locked --target x86_64-pc-windows-msvc media_foundation_encodes_video_and_audio -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/recording/verify-media.py target/media-validation-windows "$env:MARK_SHOT_RECORDING_EVIDENCE/native-encoding.mp4" --audio --fixture-colors --report "$env:MARK_SHOT_RECORDING_EVIDENCE/probe.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --lib --locked --target x86_64-pc-windows-msvc media_foundation_finalizes_on_early_exit -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/recording/verify-media.py target/media-validation-windows "$env:MARK_SHOT_RECORDING_EVIDENCE/early-exit.mp4" --report "$env:MARK_SHOT_RECORDING_EVIDENCE/early-exit-probe.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify in-process Windows exports
        run: |
          $env:MARK_SHOT_MEDIA_LIBRARY = Join-Path $env:GITHUB_WORKSPACE 'target/media-windows/markshot-media.dll'
          $env:MARK_SHOT_MEDIA_EVIDENCE = Join-Path $env:GITHUB_WORKSPACE 'target/windows-evidence/recording'
          cargo test -p shot-media --locked exports_accept_native_windows_recording -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('native-export.mkv', 'native-export.gif')) {
            & target/media-validation-windows/ffmpeg.exe -v error -xerror -i "$env:MARK_SHOT_MEDIA_EVIDENCE/$name" -enc_time_base demux -fps_mode passthrough -f null -
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Compile CPU OCR release
        run: cargo build --release --bin mark-shot --target x86_64-pc-windows-msvc --locked -j 2

      - name: Package and verify standalone build
        run: ./scripts/windows-package.ps1 -SourceSha $env:GITHUB_SHA

      - name: Upload Windows build (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: mark-shot-native-windows-x86_64-msvc
          path: |
            target/mark-shot-native-windows-x86_64-msvc.zip
            target/mark-shot-native-windows-x86_64-msvc.zip.sha256
          if-no-files-found: error

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-evidence
          path: target/windows-evidence/
          if-no-files-found: warn
