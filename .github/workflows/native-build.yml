name: Native Rust Build

on:
  push:
    branches:
      - rewrite/native-wayland
    tags:
      - 'native-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux:
    name: Linux Wayland x86_64
    runs-on: ubuntu-24.04
    env:
      XDG_CONFIG_HOME: ${{ github.workspace }}/target/ci-private/config
      XDG_DATA_HOME: ${{ github.workspace }}/target/ci-private/data
      XDG_STATE_HOME: ${{ github.workspace }}/target/ci-private/state
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev pkg-config \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libpipewire-0.3-dev \
            libssl-dev libfontconfig-dev fontconfig fonts-noto-core fonts-noto-cjk

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-directories: /home/runner/.cache/ort.pyke.io

      - name: Isolate managed Python from Cargo cache
        run: echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/native-python" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          cache-dependency-glob: .github/workflows/native-build.yml

      - name: Prepare private test directories
        run: mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME"

      - name: Pin Qt reference fonts in private fontconfig
        run: python3 scripts/ci-reference-fonts.py --github-env "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --workspace --locked -j 2

      - name: Check dynamic and bundled OCR targets
        run: |
          cargo clippy --workspace --all-targets --locked -j 2 -- -D warnings
          cargo clippy --workspace --all-targets --no-default-features --features ocr-gpu --locked -j 2 -- -D warnings

      - name: Test Python verification tools
        run: uv run --python 3.14 --with pillow --with numpy python -m unittest discover -s scripts -p 'test_*.py'

      - name: Check verification tool imports
        run: uv run --with ruff ruff check --select F scripts

      - name: Compile native release
        run: cargo build --release --locked -j 2

      - name: Verify executable and linkage
        run: |
          ./target/release/mark-shot --help > target/native-help.txt
          ldd target/release/mark-shot > target/native-linkage.txt
          cat target/native-linkage.txt
          if grep -Ei 'not found|libQt|libgtk|webkit|webview|webgpu_dawn|onnxruntime' target/native-linkage.txt; then
            exit 1
          fi

      - name: Collect dependency licenses
        run: |
          curl -fsSLo target/cargo-about.tar.gz https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.3/cargo-about-0.9.3-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' '3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4' 'target/cargo-about.tar.gz' | sha256sum --check
          mkdir -p target/cargo-about
          tar -xzf target/cargo-about.tar.gz --strip-components=1 -C target/cargo-about
          target/cargo-about/cargo-about generate --locked --workspace --target x86_64-unknown-linux-gnu --fail --config release/about.toml --output-file target/native-license-notices.txt release/license-notices.hbs

      - name: Collect native runtime notices
        run: |
          cargo metadata --locked --format-version 1 > target/native-metadata.json
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path
          packages = json.loads(Path("target/native-metadata.json").read_text())["packages"]
          manifest = Path(next(item["manifest_path"] for item in packages if item["name"] == "ort-sys"))
          table = manifest.parent / "build/download/dist.tsv"
          with table.open() as source:
              rows = [row for row in csv.DictReader(source, delimiter="\t") if row["target"] == "x86_64-unknown-linux-gnu" and row["feature_set"] == "none"]
          assert len(rows) == 1, "ambiguous native runtime distribution"
          assert rows[0]["url"] == "https://cdn.pyke.io/0/pyke:ort-rs/ms@1.28.0/x86_64-unknown-linux-gnu.tar.lzma2", "runtime version changed"
          assert rows[0]["sha256_hash"] == "e454f710f8a49f53aa5b4ff51e3454ae1835777e431c6c35c5255ce6f205fd68", "runtime distribution changed"
          PY
          mkdir -p target/native-runtime-notices
          curl -fsSLo target/native-runtime-notices/LICENSE-ONNXRUNTIME.txt https://raw.githubusercontent.com/microsoft/onnxruntime/da9b5e364c465de65c49d91e696cd6485270757f/LICENSE
          curl -fsSLo target/native-runtime-notices/NOTICES-ONNXRUNTIME.txt https://raw.githubusercontent.com/microsoft/onnxruntime/da9b5e364c465de65c49d91e696cd6485270757f/ThirdPartyNotices.txt
          printf '%s  %s\n' '2f07c72751aed99790b8a4869cf2311df85a860b22ded05fa22803587a48922c' 'target/native-runtime-notices/LICENSE-ONNXRUNTIME.txt' '0e07b95f3a8d6230037707c5c4a2b554d12c4cb67369669ac255635528ffcee2' 'target/native-runtime-notices/NOTICES-ONNXRUNTIME.txt' | sha256sum --check

      - name: Package native build
        run: |
          mkdir -p target/native-dist/mark-shot-native/docs target/native-dist/mark-shot-native/licenses
          install -m 755 target/release/mark-shot target/native-dist/mark-shot-native/mark-shot
          cp LICENSE-MIT LICENSE-APACHE README.md target/native-dist/mark-shot-native/
          cp assets/fonts/LICENSE-OFL.txt assets/fonts/LICENSE-NUMERALS.txt target/native-dist/mark-shot-native/licenses/
          cp assets/icons/mark-shot/LICENSE target/native-dist/mark-shot-native/licenses/LICENSE-ICONS.txt
          cp target/native-license-notices.txt target/native-dist/mark-shot-native/licenses/DEPENDENCIES.txt
          cp target/native-runtime-notices/*.txt target/native-dist/mark-shot-native/licenses/
          cp docs/*.md target/native-dist/mark-shot-native/docs/
          cp target/native-help.txt target/native-linkage.txt target/native-dist/mark-shot-native/
          printf '%s\n' "$GITHUB_SHA" > target/native-dist/mark-shot-native/SOURCE-COMMIT
          tar -C target/native-dist -czf target/mark-shot-native-linux-x86_64.tar.gz mark-shot-native
          cd target
          sha256sum mark-shot-native-linux-x86_64.tar.gz > mark-shot-native-linux-x86_64.tar.gz.sha256

      - name: Upload native build
        uses: actions/upload-artifact@v4
        with:
          name: mark-shot-native-linux-x86_64
          path: |
            target/mark-shot-native-linux-x86_64.tar.gz
            target/mark-shot-native-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
