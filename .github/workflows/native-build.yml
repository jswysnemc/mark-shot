name: Native Rust Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux:
    name: Linux Wayland ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      XDG_CONFIG_HOME: ${{ github.workspace }}/target/ci-private/config
      XDG_DATA_HOME: ${{ github.workspace }}/target/ci-private/data
      XDG_STATE_HOME: ${{ github.workspace }}/target/ci-private/state
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Record actual source identity
        run: echo "NATIVE_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev pkg-config \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libpipewire-0.3-dev \
            libssl-dev libfontconfig-dev fontconfig fonts-dejavu-core fonts-noto-core fonts-noto-cjk \
            meson ninja-build nasm libva-dev libdrm-dev libcap-dev libpulse-dev \
            libxcomposite-dev libxrandr-dev libxfixes-dev libxdamage-dev libegl-dev libdbus-1-dev libgbm-dev wayland-protocols

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 【原生构建】【工具链】ort-sys 复制动态库依赖 Cargo 1.100 之前的构建目录结构
          toolchain: '1.99.1'
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-directories: /home/runner/.cache/ort.pyke.io

      - name: Isolate managed Python from Cargo cache
        run: echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/native-python" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          cache-dependency-glob: .github/workflows/native-build.yml

      - name: Prepare private test directories
        run: mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME"

      - name: Pin Qt reference fonts in private fontconfig
        run: python3 scripts/ci-reference-fonts.py --github-env "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --workspace --locked -j 2

      - name: Check dynamic and bundled OCR targets
        run: |
          cargo clippy --workspace --all-targets --locked -j 2 -- -D warnings
          if [[ "$(uname -m)" == x86_64 ]]; then
            cargo clippy --workspace --all-targets --no-default-features --features ocr-gpu --locked -j 2 -- -D warnings
          fi

      - name: Test Python verification tools
        run: uv run --python 3.14 --with pillow --with numpy python -m unittest discover -s scripts -p 'test_*.py'

      - name: Check verification tool imports
        run: uv run --with ruff ruff check --select F scripts

      - name: Test package contracts and migrated workflow coverage
        run: |
          uv run --with pyyaml python -m unittest discover -s tests/packaging -v
          uv run --with ruff ruff check --select F scripts/packaging tests/packaging
          uv run --with ruff ruff format --check scripts/packaging tests/packaging

      - name: Validate workflow expressions and packaging scripts
        run: bash scripts/packaging/check_workflows.sh

      - name: Compile native release
        run: cargo build --release --locked -j 2

      - name: Build in-process media library with corresponding sources
        run: bash scripts/media/build-libraries.sh linux > target/media-build.log 2>&1 || { tail -100 target/media-build.log; exit 1; }

      - name: Verify in-process software encoding and exports
        run: |
          mkdir -p target/media-evidence
          MARK_SHOT_MEDIA_LIBRARY="$PWD/target/media-linux/libmarkshot-media.so" MARK_SHOT_MEDIA_EVIDENCE="$PWD/target/media-evidence" cargo test -p shot-media --locked -- --ignored --nocapture

      - name: Verify executable and linkage
        run: |
          ./target/release/mark-shot --help > target/native-help.txt
          ldd target/release/mark-shot > target/native-linkage.txt
          cat target/native-linkage.txt
          if grep -Ei 'not found|libQt|libgtk|webkit|webview|webgpu_dawn|onnxruntime' target/native-linkage.txt; then
            exit 1
          fi

      - name: Collect dependency and native runtime notices
        run: bash scripts/packaging/collect_licenses.sh

      - name: Package native build
        run: |
          staging=$(mktemp -d "$RUNNER_TEMP/mark-shot-package.XXXXXX")
          package="$staging/mark-shot-native"
          mkdir -p "$package/licenses" "$package/media"
          install -m 755 target/release/mark-shot "$package/mark-shot"
          cp -a target/media-linux/. "$package/media/"
          test -f "$package/media/libmarkshot-media.so"
          (cd "$package/media"; sha256sum --check SHA256SUMS)
          cp LICENSE-MIT LICENSE-APACHE "$package/"
          cp assets/fonts/LICENSE-OFL.txt assets/fonts/LICENSE-NUMERALS.txt "$package/licenses/"
          cp assets/icons/mark-shot/LICENSE "$package/licenses/LICENSE-ICONS.txt"
          cp target/packaging-licenses/DEPENDENCIES.txt "$package/licenses/DEPENDENCIES.txt"
          cp target/packaging-licenses/*.txt "$package/licenses/"
          cp target/native-help.txt target/native-linkage.txt "$package/"
          printf '%s\n' "$NATIVE_SOURCE_SHA" > "$package/SOURCE-COMMIT"
          tar -C "$staging" -czf target/mark-shot-native-linux-${{ matrix.arch }}.tar.gz mark-shot-native
          cd target
          sha256sum mark-shot-native-linux-${{ matrix.arch }}.tar.gz > mark-shot-native-linux-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload native build
        uses: actions/upload-artifact@v4
        with:
          name: mark-shot-native-linux-${{ matrix.arch }}
          path: |
            target/mark-shot-native-linux-${{ matrix.arch }}.tar.gz
            target/mark-shot-native-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
