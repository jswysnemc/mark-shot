name: Native Rust Build

on:
  push:
    branches:
      - rewrite/native-wayland
    tags:
      - 'native-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux:
    name: Linux Wayland x86_64
    runs-on: ubuntu-24.04
    env:
      XDG_CONFIG_HOME: ${{ github.workspace }}/target/ci-private/config
      XDG_DATA_HOME: ${{ github.workspace }}/target/ci-private/data
      XDG_STATE_HOME: ${{ github.workspace }}/target/ci-private/state
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev pkg-config \
            libwayland-dev libxkbcommon-dev libpipewire-0.3-dev \
            libssl-dev fontconfig

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Prepare private test directories
        run: mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --workspace --locked -j 2

      - name: Check all Rust targets and features
        run: cargo clippy --workspace --all-targets --all-features --locked -j 2 -- -D warnings

      - name: Test Python verification tools
        run: uv run --python 3.14 --with pillow --with numpy python -m unittest discover -s scripts -p 'test_*.py'

      - name: Check verification tool imports
        run: uv run --with ruff ruff check --select F scripts

      - name: Compile native release
        run: cargo build --release --locked -j 2

      - name: Verify executable and linkage
        run: |
          ./target/release/mark-shot --help > target/native-help.txt
          ldd target/release/mark-shot > target/native-linkage.txt
          cat target/native-linkage.txt
          if grep -Ei 'not found|libQt|libgtk|webkit|webview' target/native-linkage.txt; then
            exit 1
          fi

      - name: Package native build
        run: |
          mkdir -p target/native-dist/mark-shot-native/docs
          install -m 755 target/release/mark-shot target/native-dist/mark-shot-native/mark-shot
          cp LICENSE-MIT LICENSE-APACHE README.md target/native-dist/mark-shot-native/
          cp docs/*.md target/native-dist/mark-shot-native/docs/
          cp target/native-help.txt target/native-linkage.txt target/native-dist/mark-shot-native/
          printf '%s\n' "$GITHUB_SHA" > target/native-dist/mark-shot-native/SOURCE-COMMIT
          tar -C target/native-dist -czf target/mark-shot-native-linux-x86_64.tar.gz mark-shot-native
          cd target
          sha256sum mark-shot-native-linux-x86_64.tar.gz > mark-shot-native-linux-x86_64.tar.gz.sha256

      - name: Upload native build
        uses: actions/upload-artifact@v4
        with:
          name: mark-shot-native-linux-x86_64
          path: |
            target/mark-shot-native-linux-x86_64.tar.gz
            target/mark-shot-native-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
